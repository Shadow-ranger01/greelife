<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="780" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="640" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Green Life — ESP32 Hardware Connection Diagram</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#475569">Wire Colors: Red = 5V | Orange = 3.3V | Dark Slate = Common GND | Colored = GPIO / I2C Signals</text>

  <!-- ==================== TOP & BOTTOM POWER RAILS ==================== -->
  <!-- 3.3V Top Bus (Orange) -->
  <polyline points="500,190 420,190 420,90 855,90 855,145" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <!-- 3V3 drop to Soil -->
  <polyline points="420,190 420,240 330,240" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <!-- 3V3 drop to DHT11 -->
  <polyline points="420,90 330,90 330,115" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <!-- 3V3 to BMP280 & BH1750 -->
  <line x1="855" y1="115" x2="930" y2="115" stroke="#ea580c" stroke-width="2.5"/>
  <polyline points="855,145 855,245 930,245" fill="none" stroke="#ea580c" stroke-width="2.5"/>

  <!-- GND Bus (Dark Slate #1e293b) -->
  <polyline points="500,410 400,410 400,670 870,670 870,485 930,485" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="780" y1="500" x2="870" y2="500" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Left GND drops -->
  <polyline points="400,410 400,170 330,170" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="330" y1="295" x2="400" y2="295" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="330" y1="395" x2="400" y2="395" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="330" y1="515" x2="400" y2="515" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="330" y1="670" x2="400" y2="670" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Right GND drops -->
  <polyline points="870,485 870,138 930,138" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="870" y1="268" x2="930" y2="268" stroke="#1e293b" stroke-width="2.5"/>

  <!-- 5V Bus (Red #dc2626) -->
  <polyline points="500,480 440,480 440,695 890,695 890,415 930,415" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <!-- Relay DC+ and COM to 5V -->
  <line x1="330" y1="485" x2="440" y2="485" stroke="#dc2626" stroke-width="2.5"/>
  <polyline points="440,485 440,545 330,545" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <!-- ==================== SIGNAL WIRES ==================== -->
  <!-- DHT11 DATA -> GPIO 4 (Cyan, routed over top y=74) -->
  <polyline points="330,145 365,145 365,74 820,74 820,430 780,430" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Soil SIG -> GPIO 34 (Green) -->
  <polyline points="330,268 460,268 460,240 500,240" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <!-- Buzzer + -> GPIO 25 (Amber) -->
  <polyline points="330,365 470,365 470,290 500,290" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <!-- Relay IN -> GPIO 26 (Purple) -->
  <polyline points="330,575 480,575 480,340 500,340" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <!-- Relay NO -> Pump (+) (Blue) -->
  <polyline points="200,595 200,635" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- I2C SCL (GPIO 22 -> BMP280 & BH1750) -->
  <polyline points="780,190 835,190 835,162 930,162" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <polyline points="835,190 835,292 930,292" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- I2C SDA (GPIO 21 -> BMP280 & BH1750) -->
  <polyline points="780,240 845,240 845,185 930,185" fill="none" stroke="#0891b2" stroke-width="2.5"/>
  <polyline points="845,240 845,315 930,315" fill="none" stroke="#0891b2" stroke-width="2.5"/>

  <!-- HC-SR04 TRIG -> GPIO 5 (Indigo) -->
  <polyline points="780,360 805,360 805,438 930,438" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <!-- HC-SR04 ECHO -> 1k -> GPIO 18 + 2k -> GND (Pink) -->
  <line x1="930" y1="462" x2="882" y2="462" stroke="#db2777" stroke-width="2.5"/>
  <!-- 1k Resistor box -->
  <rect x="826" y="453" width="56" height="18" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="854" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">1k&#937;</text>
  <polyline points="826,462 795,462 795,310 780,310" fill="none" stroke="#db2777" stroke-width="2.5"/>
  <!-- 2k Resistor tap to GND -->
  <circle cx="810" cy="462" r="4" fill="#db2777"/>
  <line x1="810" y1="462" x2="810" y2="510" stroke="#db2777" stroke-width="2"/>
  <rect x="794" y="510" width="32" height="44" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="810" y="536" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">2k&#937;</text>
  <polyline points="810,554 810,670" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="810" cy="670" r="4" fill="#1e293b"/>

  <!-- ==================== ESP32 CENTER BOARD ==================== -->
  <rect x="500" y="130" width="280" height="445" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
  <rect x="565" y="150" width="150" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="640" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">ESP32</text>
  <text x="640" y="214" text-anchor="middle" font-size="11" fill="#94a3b8">DevKit (3.3V Logic)</text>

  <!-- ESP32 Left Pins -->
  <g font-size="12" font-weight="600" fill="#f8fafc">
    <circle cx="500" cy="190" r="6" fill="#ea580c"/><text x="514" y="194">3V3</text>
    <circle cx="500" cy="240" r="6" fill="#16a34a"/><text x="514" y="244">GPIO 34 (ADC1)</text>
    <circle cx="500" cy="290" r="6" fill="#d97706"/><text x="514" y="294">GPIO 25</text>
    <circle cx="500" cy="340" r="6" fill="#7c3aed"/><text x="514" y="344">GPIO 26</text>
    <circle cx="500" cy="410" r="6" fill="#64748b"/><text x="514" y="414">GND</text>
    <circle cx="500" cy="480" r="6" fill="#dc2626"/><text x="514" y="484">5V / VIN</text>
  </g>

  <!-- ESP32 Right Pins -->
  <g font-size="12" font-weight="600" fill="#f8fafc" text-anchor="end">
    <circle cx="780" cy="190" r="6" fill="#2563eb"/><text x="766" y="194">GPIO 22 (SCL)</text>
    <circle cx="780" cy="240" r="6" fill="#0891b2"/><text x="766" y="244">GPIO 21 (SDA)</text>
    <circle cx="780" cy="310" r="6" fill="#db2777"/><text x="766" y="314">GPIO 18 (ECHO)</text>
    <circle cx="780" cy="360" r="6" fill="#4f46e5"/><text x="766" y="364">GPIO 5 (TRIG)</text>
    <circle cx="780" cy="430" r="6" fill="#0284c7"/><text x="766" y="434">GPIO 4 (DATA)</text>
    <circle cx="780" cy="500" r="6" fill="#64748b"/><text x="766" y="504">GND</text>
  </g>

  <!-- USB Cable -->
  <rect x="615" y="555" width="50" height="24" rx="4" fill="#94a3b8"/>
  <line x1="640" y1="579" x2="640" y2="612" stroke="#475569" stroke-width="5"/>
  <rect x="545" y="612" width="190" height="42" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="640" y="638" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">USB Cable (5V + Code)</text>

  <!-- ==================== LEFT COMPONENTS ==================== -->
  <!-- DHT11 -->
  <rect x="40" y="100" width="290" height="88" rx="10" fill="#eff6ff" stroke="#3b8ed7" stroke-width="2"/>
  <text x="56" y="124" font-size="14" font-weight="700" fill="#1e3a8a">DHT11 Temp &amp; Humidity</text>
  <g font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">
    <text x="316" y="120">VCC (3.3V)</text><circle cx="330" cy="115" r="5" fill="#ea580c"/>
    <text x="316" y="149">DATA</text><circle cx="330" cy="145" r="5" fill="#0284c7"/>
    <text x="316" y="174">GND</text><circle cx="330" cy="170" r="5" fill="#1e293b"/>
  </g>

  <!-- Soil Moisture Sensor -->
  <rect x="40" y="215" width="290" height="96" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="56" y="242" font-size="14" font-weight="700" fill="#065f46">Soil Moisture Sensor</text>
  <text x="56" y="262" font-size="11" fill="#047857">Analog output (ADC1)</text>
  <g font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">
    <text x="316" y="244">VCC (3.3V)</text><circle cx="330" cy="240" r="5" fill="#ea580c"/>
    <text x="316" y="272">AO / SIG</text><circle cx="330" cy="268" r="5" fill="#16a34a"/>
    <text x="316" y="299">GND</text><circle cx="330" cy="295" r="5" fill="#1e293b"/>
  </g>

  <!-- 3.3V Active Buzzer -->
  <rect x="40" y="335" width="290" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="56" y="362" font-size="14" font-weight="700" fill="#78350f">3.3V Active Buzzer</text>
  <text x="56" y="382" font-size="11" fill="#92400e">High temp / low tank alert</text>
  <g font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">
    <text x="316" y="369">(+) Signal</text><circle cx="330" cy="365" r="5" fill="#d97706"/>
    <text x="316" y="399">(-) GND</text><circle cx="330" cy="395" r="5" fill="#1e293b"/>
  </g>

  <!-- 1-Channel 5V Relay Module -->
  <rect x="40" y="455" width="290" height="140" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="56" y="482" font-size="14" font-weight="700" fill="#7f1d1d">1-Channel 5V Relay Module</text>
  <text x="56" y="502" font-size="11" fill="#991b1b">Switches 5V to water pump</text>
  <text x="56" y="582" font-size="12" font-weight="700" fill="#1d4ed8">NO (Normally Open) &#8595;</text>
  <circle cx="200" cy="595" r="5" fill="#2563eb"/>
  <g font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">
    <text x="316" y="489">DC+ (5V)</text><circle cx="330" cy="485" r="5" fill="#dc2626"/>
    <text x="316" y="519">DC- (GND)</text><circle cx="330" cy="515" r="5" fill="#1e293b"/>
    <text x="316" y="549">COM (5V)</text><circle cx="330" cy="545" r="5" fill="#dc2626"/>
    <text x="316" y="579">IN (Signal)</text><circle cx="330" cy="575" r="5" fill="#7c3aed"/>
  </g>

  <!-- 5V Pump + Diode + Tubing -->
  <rect x="40" y="635" width="290" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="660" font-size="14" font-weight="700" fill="#1e3a8a">5V Mini Submersible Pump</text>
  <text x="56" y="680" font-size="11" fill="#1d4ed8">Add 1N4007 flyback diode across + / -</text>
  <text x="56" y="704" font-size="12" font-weight="600" fill="#065f46">Outlet &#8594; Tubing &#8594; Plant</text>
  <circle cx="200" cy="635" r="5" fill="#2563eb"/>
  <text x="210" y="649" font-size="11" font-weight="700" fill="#1d4ed8">(+)</text>
  <circle cx="330" cy="670" r="5" fill="#1e293b"/>
  <text x="318" y="674" text-anchor="end" font-size="11" font-weight="700" fill="#0f172a">(-) GND</text>

  <!-- ==================== RIGHT COMPONENTS ==================== -->
  <!-- BMP280 -->
  <rect x="930" y="95" width="305" height="105" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1220" y="122" text-anchor="end" font-size="14" font-weight="700" fill="#312e81">BMP280 Pressure (I2C)</text>
  <g font-size="12" font-weight="600" fill="#0f172a">
    <circle cx="930" cy="115" r="5" fill="#ea580c"/><text x="942" y="119">VCC (3.3V)</text>
    <circle cx="930" cy="138" r="5" fill="#1e293b"/><text x="942" y="142">GND</text>
    <circle cx="930" cy="162" r="5" fill="#2563eb"/><text x="942" y="166">SCL</text>
    <circle cx="930" cy="185" r="5" fill="#0891b2"/><text x="942" y="189">SDA</text>
  </g>

  <!-- BH1750 -->
  <rect x="930" y="225" width="305" height="105" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="1220" y="252" text-anchor="end" font-size="14" font-weight="700" fill="#713f12">BH1750 Light Sensor (I2C)</text>
  <g font-size="12" font-weight="600" fill="#0f172a">
    <circle cx="930" cy="245" r="5" fill="#ea580c"/><text x="942" y="249">VCC (3.3V)</text>
    <circle cx="930" cy="268" r="5" fill="#1e293b"/><text x="942" y="272">GND</text>
    <circle cx="930" cy="292" r="5" fill="#2563eb"/><text x="942" y="296">SCL</text>
    <circle cx="930" cy="315" r="5" fill="#0891b2"/><text x="942" y="319">SDA</text>
  </g>

  <!-- HC-SR04 -->
  <rect x="930" y="385" width="305" height="125" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="1220" y="412" text-anchor="end" font-size="14" font-weight="700" fill="#831843">HC-SR04 Ultrasonic</text>
  <text x="1220" y="430" text-anchor="end" font-size="11" fill="#9d174d">Water Tank Level</text>
  <g font-size="12" font-weight="600" fill="#0f172a">
    <circle cx="930" cy="415" r="5" fill="#dc2626"/><text x="942" y="419">VCC (5V)</text>
    <circle cx="930" cy="438" r="5" fill="#4f46e5"/><text x="942" y="442">TRIG</text>
    <circle cx="930" cy="462" r="5" fill="#db2777"/><text x="942" y="466">ECHO (via 1k/2k divider)</text>
    <circle cx="930" cy="485" r="5" fill="#1e293b"/><text x="942" y="489">GND</text>
  </g>

  <!-- Power & Breadboard Note Box -->
  <rect x="930" y="545" width="305" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="946" y="572" font-size="13" font-weight="700" fill="#0f172a">Breadboard &amp; Power Tips</text>
  <text x="946" y="596" font-size="11.5" fill="#334155">1. Place ESP32 across breadboard center.</text>
  <text x="946" y="618" font-size="11.5" fill="#334155">2. Connect all GND pins to one GND rail.</text>
  <text x="946" y="640" font-size="11.5" fill="#334155">3. Keep I2C sensors (BMP280 + BH1750)</text>
  <text x="960" y="656" font-size="11.5" fill="#334155">on shared GPIO 21 (SDA) &amp; 22 (SCL).</text>
  <text x="946" y="678" font-size="11.5" fill="#334155">4. Never feed 5V ECHO directly to ESP32.</text>
  <text x="946" y="700" font-size="11.5" fill="#334155">5. Use external 5V if pump resets ESP32.</text>
</svg>
